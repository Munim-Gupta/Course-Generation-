{% extends "base.html" %}

{% block title %}Register | CourseGen{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4 border-0">
                    <i class="bi bi-person-plus-fill display-5 text-primary mb-2 d-block"></i>
                    <h4 class="fw-bold mb-1">Create an Account</h4>
                    <p class="text-light-50 small mb-0">Join to generate structured courses and track your progress</p>
                </div>
                <div class="card-body p-4 p-md-5 bg-white">
                    <form action="{{ url_for('register.register') }}" method="POST" id="registerForm" novalidate>
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold small">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. Alex Johnson" required>
                            </div>
                        </div>

                        <!-- Email Address -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-light border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@college.edu" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="At least 6 characters" required>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold small">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-check"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-type your password" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-arrow-right-circle-fill me-2"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center pt-2 border-top">
                        <small class="text-muted">Already have an account? <a href="{{ url_for('login.login') }}" class="text-primary fw-semibold text-decoration-none">Log in here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
